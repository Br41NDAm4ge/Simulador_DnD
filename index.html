<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador DnD</title>
    <!-- Importando seus CSS -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/grid.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="tabs">
                <button id="btn-tiles" class="active">Tiles</button>
                <button id="btn-monsters">Monstros</button>
            </div>
            
            <div id="tiles-panel" class="panel">
                <div id="tiles-list"></div>
            </div>

            <div id="monsters-panel" class="panel" style="display: none;">
                <p>Monstros em breve...</p>
            </div>
        </aside>

        <main id="canvas-container">
            <canvas id="mapCanvas"></canvas>
        </main>
    </div>

    <!-- Importando seus JS na ordem correta -->
    <script src="js/main.js"></script>
    <script src="js/ui_logic.js"></script>
    <script src="js/map_logic.js"></script>
</body>
</html>
