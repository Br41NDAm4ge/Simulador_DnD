<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Simulador D&D</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/grid.css">
</head>
<body>
    <aside id="sidebar">
        <h2>Simulador D&D</h2>
        <nav>
            <ul>
                <!-- Menu Estruturas -->
                <li>
                    <button class="menu-btn" id="btn-estruturas">Estruturas</button>
                    <div id="structures-submenu" class="submenu hidden">
                        <button class="color-btn" data-color="#3498db" style="background-color: #3498db;">Água</button>
                        <button class="color-btn" data-color="#4b7c3e" style="background-color: #4b7c3e;">Grama</button>
                        <button class="color-btn" data-color="#7f8c8d" style="background-color: #7f8c8d;">Pedra</button>
                        <button class="color-btn" data-color="default" style="background-color: #555555; border: 1px dashed #fff;">Apagar / Padrão</button>
                    </div>
                </li>

                <!-- Menu Ferramentas -->
                <li>
                    <button class="menu-btn" id="btn-ferramentas">Ferramentas</button>
                    <div id="tools-submenu" class="submenu hidden">
                        <button class="tool-btn active-tool" data-tool="paint">Pincel Livre</button>
                        <button class="tool-btn" data-tool="rectangle">Retângulo (Área)</button>
                        <button class="tool-btn" data-tool="move">Mover Área</button>
                        <button class="tool-btn" data-tool="generate">Gerar Terreno</button>
                    </div>
                </li>

                <!-- Outros menus -->
                <li><button class="menu-btn">Criaturas</button></li>
                <li><button class="menu-btn">NPC</button></li>
                <li><button class="menu-btn">Boss</button></li>
            </ul>
        </nav>
    </aside>

    <div id="map-grid"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
